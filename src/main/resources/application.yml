spring:
  application:
    name: vendor-confirmed-p2p-transfer-service
  datasource:
    # local Postgres from docker-compose
    url: jdbc:postgresql://localhost:5433/p2p_transfer
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      # schema is owned by Liquibase, Hibernate only checks that entities match it
      ddl-auto: validate
