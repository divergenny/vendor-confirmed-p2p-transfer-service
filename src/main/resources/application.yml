spring:
  config:
    # the same .env as docker compose reads, so the app started from the IDE gets the same credentials
    import: optional:file:.env[.properties]
  application:
    name: vendor-confirmed-p2p-transfer-service
  datasource:
    # local Postgres from docker-compose
    url: jdbc:postgresql://localhost:5433/${DB_NAME:p2p_transfer}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  web:
    # validation messages in English whatever the OS language is
    locale: en
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      # schema is owned by Liquibase, Hibernate only checks that entities match it
      ddl-auto: validate

springdoc:
  # our endpoints answer with JSON, without this the spec says */*
  default-produces-media-type: application/json

vendor:
  url: http://localhost:8089
  connect-timeout: 2s
  # the vendor answers within 10 s, so we wait a bit longer than that
  read-timeout: 12s
  max-attempts: 3
  retry-delay: 500ms

transfers:
  pending-retry:
    enabled: true
    # how often the job looks for transfers that are still PENDING
    interval: 1m
    # fresh ones are left alone: the request itself may still be asking the vendor (up to ~37 s)
    older-than: 2m
    batch-size: 100
  history:
    # a day in the history is a day in the bank's time zone, not in the server's one
    time-zone: Asia/Tashkent
