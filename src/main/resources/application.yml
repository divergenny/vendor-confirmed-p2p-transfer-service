spring:
  application:
    name: vendor-confirmed-p2p-transfer-service
  datasource:
    # local Postgres from docker-compose
    url: jdbc:postgresql://localhost:5433/p2p_transfer
    username: postgres
    password: postgres
  web:
    # validation messages in English whatever the OS language is
    locale: en
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      # schema is owned by Liquibase, Hibernate only checks that entities match it
      ddl-auto: validate

vendor:
  url: http://localhost:8089
  connect-timeout: 2s
  # the vendor answers within 10 s, so we wait a bit longer than that
  read-timeout: 12s
  max-attempts: 3
  retry-delay: 500ms
