spring:
  application:
    name: vendor-confirmed-p2p-transfer-service
  datasource:
    # local Postgres from docker-compose (5433 on the host, so it doesn't clash with a local 5432)
    url: jdbc:postgresql://localhost:5433/p2p_transfer
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    open-in-view: false
    hibernate:
      # schema is owned by Liquibase, Hibernate only checks that entities match it
      ddl-auto: validate
