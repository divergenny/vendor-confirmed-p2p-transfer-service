databaseChangeLog:
  - changeSet:
      id: add-users-password-hash
      author: divergenny
      changes:
        # bcrypt hash, never the password itself; users created before this change can't log in
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: password_hash
                  type: VARCHAR(100)

  # everyone from the dev test data gets the password "password"
  - changeSet:
      id: set-dev-passwords
      author: divergenny
      context: dev
      changes:
        - sql:
            sql: |
              UPDATE users
              SET password_hash = '$2a$10$X6Zx.cbsMPyjHMWcmVKTeOD0G0PLUELHQuxvVyNCaGGmBEDnlf4we'
              WHERE username IN ('aziz', 'ivan', 'dilnoza', 'elena');
