              VALUES ('7f3c9a2e-5b1d-4e8a-9c6f-2d4b8e1a0f35',
                      (SELECT id FROM users WHERE username = 'aziz'),
                      (SELECT id FROM users WHERE username = 'ivan'),
                      150000.00, 'COMPLETED', '2026-11-10 10:15:00+00', '2026-11-10 10:15:02+00');

