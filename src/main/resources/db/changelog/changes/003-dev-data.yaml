# Test data for local runs. The "dev" context lets a real environment skip it
# (run with spring.liquibase.contexts=prod)
databaseChangeLog:
  - changeSet:
      id: insert-dev-users
      author: divergenny
      context: dev
      changes:
        - sql:
            sql: |
              INSERT INTO users (username, full_name, balance)
              VALUES ('aziz', 'Aziz Karimov', 1000000.00),
                     ('ivan', 'Ivan Petrov', 500000.00),
                     ('dilnoza', 'Dilnoza Rahimova', 250000.00),
                     ('elena', 'Elena Smirnova', 0.00);

  # balances above already include the two COMPLETED transfers
