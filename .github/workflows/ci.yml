name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# the workflow only reads the code
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # integration tests start PostgreSQL in Docker (Testcontainers), the runner already has Docker
      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports
