# Database credentials come from .env (see .env.example).
# Without .env the dev values after ":-" are used, so "docker compose up --build" works right away.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-p2p_transfer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-p2p_transfer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # fake vendor, its answers are described in wiremock/mappings
  vendor-stub:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8089:8080"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      vendor-stub:
        condition: service_started
    environment:
      # inside the compose network services find each other by name
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-p2p_transfer}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      VENDOR_URL: http://vendor-stub:8080
    ports:
      - "8080:8080"
