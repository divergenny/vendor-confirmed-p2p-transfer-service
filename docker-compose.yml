services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: p2p_transfer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d p2p_transfer"]
      interval: 5s
      timeout: 5s
      retries: 10
